# Deploy the game (static files, no build step) to GitHub Pages.
# Enable once: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ship only what the browser loads; raw Gemini art, poses and Python tools stay out.
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -r css js _site/
          cp -r assets/sprites _site/assets/
          cp -r assets/share _site/assets/   # link-preview image (og:image)
          touch _site/.nojekyll

      # Dev console password: store it as repo secret CONSOLE_PASSWORD. Only a salted PBKDF2 hash is published.
      # Without the secret the console stays disabled on the public site.
      - name: Write console password hash
        env:
          CONSOLE_PASSWORD: ${{ secrets.CONSOLE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, secrets
          pw = os.environ.get("CONSOLE_PASSWORD", "")
          out = "_site/js/dev_config.js"
          if not pw:
              open(out, "w").write("window.DEV_CONSOLE = null;\n")
              print("CONSOLE_PASSWORD not set: console disabled on the public site")
          else:
              salt, it = secrets.token_hex(16), 310000
              h = hashlib.pbkdf2_hmac("sha256", pw.encode(), salt.encode(), it).hex()
              open(out, "w").write("window.DEV_CONSOLE = " + json.dumps({"salt": salt, "iter": it, "hash": h}) + ";\n")
              print("console password hash written")
          PY
          du -sh _site

      # Version shown on the title screen: the commit being deployed and its date
      - name: Write build info
        run: |
          echo "window.GAME_BUILD = {\"sha\": \"${GITHUB_SHA}\", \"date\": \"$(git log -1 --format=%cI)\"};" > _site/js/build_info.js
          cat _site/js/build_info.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
