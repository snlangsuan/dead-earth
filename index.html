<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Earth — โลกหลังวันสิ้นโลก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// cache-busting: always load the current game files (a stale cached script mixed with new ones breaks features)
window.BUILD = Date.now();
for (const h of ['css/style.css', 'css/theme.css']) document.write('<link rel="stylesheet" href="' + h + '?v=' + BUILD + '">');
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="screen"></div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
// scripts load in this order (document.write keeps them synchronous and ordered)
['js/util.js','js/audio.js','js/data_items.js','js/data_chars.js','js/data_world.js','js/state.js','js/mapgen.js','js/game.js','assets/sprites/manifest.js','js/art.js','js/render.js','js/render_room.js','js/traps.js','js/doors.js','js/extract.js','js/keys.js','js/days.js','js/bags.js','js/durability.js','js/menu_fx.js','js/ui_grid.js','js/ui_run.js','js/ui_base.js','js/item_names_en.js','js/dev_config.js','js/console.js','js/main.js'].forEach(src => document.write('<script src="' + src + '?v=' + BUILD + '"><\/script>'));
</script>
</body>
</html>
